benchmark:
  name: "Iris_Clustering_Benchmark"
  dataset: "../data/iris.csv"

pipeline_template:
  - type: "clustering"
    algorithms: ["Hierarchical", "DBSCAN"]
    params:
      Hierarchical:
        n_clusters: 3
        linkage: "complete"
        distance_measure: "Cosine"
      DBSCAN:
        eps: 0.6
        min_samples: 4
        distance_measure: "Manhattan"

  - type: "clustering_quality"
    algorithms: ["Calinski_Harabasz", "Davies_Bouldin"]
    params:
      Calinski_Harabasz: {}
      Davies_Bouldin: {}

iterations: 3
output:
  directory: "benchmark_results"
  format: ["csv"]
timeout: 300
verbose: true
